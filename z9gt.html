<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Denza Z9GT — Configurador 3D</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: #fff;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* Container exigido pelo runtime 3D da Denza: init() faz
     document.querySelector('.zn--wrapper') e monta o app Vue nele. */
  .zn--wrapper { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* Botao "Back to Gallery" do build original nao faz sentido dentro do embed.
     Some por padrao; use ?ui=full para exibir. */
  body:not(.ui-full) .page-config { display: none !important; }

  #zn-loader {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #fff; color: #021349;
    transition: opacity .45s ease; 
  }
  #zn-loader.hidden { opacity: 0; pointer-events: none; }
  #zn-loader .zl-label { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
  #zn-loader .zl-track { width: min(240px, 55vw); height: 2px; background: rgba(2,19,73,.12); overflow: hidden; border-radius: 2px; }
  #zn-loader .zl-bar { height: 100%; width: 0%; background: #021349; transition: width .25s ease; }
  #zn-loader .zl-pct { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .5; }
  #zn-error {
    position: fixed; inset: 0; z-index: 100000; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; text-align: center; background: #fff; color: #021349;
  }
  #zn-error.show { display: flex; }
  #zn-error b { font-size: 15px; }
  #zn-error span { font-size: 13px; opacity: .6; max-width: 420px; line-height: 1.5; }

  /* Botao proprio "Voltar ao 360" (injetado via JS).
     Mesmo estilo dos botoes Espaco/Tecnologia da Denza:
     fundo branco, texto navy, borda sutil e cantos suaves. */
  #zn-back {
    position: fixed; top: 16px; left: 16px; z-index: 99998;
    display: none; align-items: center; gap: 6px;
    padding: 10px 16px; border: 1px solid rgba(2,19,73,.22); border-radius: 8px;
    background: #fff; color: #021349;
    font: 500 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.10);
  }
  #zn-back.show { display: inline-flex; }

  /* ---- barra de configuracao embutida (mesma ideia do embed do B5) -----
     O viewer roda em modo "config" e a UI nativa fica suprimida, entao esta
     barra devolve o controle (cores/interior/vista) para dentro do
     iframe. Ligada por padrao; use ?bar=0 para esconder.                  */
  #zn-ui {
    position: fixed; z-index: 99997; left: 50%; bottom: 18px;
    transform: translateX(-50%);
    display: none; align-items: center; gap: 14px;
    max-width: calc(100% - 24px); padding: 9px 14px;
    background: rgba(255,255,255,.82);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid rgba(2,19,73,.08); border-radius: 999px;
    box-shadow: 0 4px 24px rgba(0,0,0,.12);
    font: 500 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #021349; opacity: 0; transition: opacity .4s ease;
    overflow-x: auto; scrollbar-width: none;
  }
  #zn-ui::-webkit-scrollbar { display: none; }
  body.has-bar #zn-ui { display: flex; }
  body.has-bar.zn-ready #zn-ui { opacity: 1; }

  #zn-ui .grp { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  #zn-ui .sep { width: 1px; height: 18px; background: rgba(2,19,73,.12); flex: 0 0 auto; }

  #zn-ui .dot {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(2,19,73,.20); padding: 0;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.18);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #zn-ui .dot:hover { transform: scale(1.12); }
  #zn-ui .dot[aria-pressed="true"] { box-shadow: 0 0 0 2px #021349, inset 0 -3px 6px rgba(0,0,0,.18); }

  #zn-ui .seg { display: flex; background: rgba(2,19,73,.06); border-radius: 999px; padding: 2px; flex: 0 0 auto; }
  #zn-ui .seg button {
    font: inherit; letter-spacing: .05em; text-transform: uppercase;
    padding: 6px 11px; border: 0; border-radius: 999px; background: transparent;
    color: #5b6480; cursor: pointer; white-space: nowrap;
  }
  #zn-ui .seg button[aria-pressed="true"] { background: #fff; color: #021349; box-shadow: 0 1px 3px rgba(0,0,0,.14); }

  @media (max-width: 560px) {
    #zn-ui { gap: 10px; padding: 8px 10px; bottom: 12px; }
    #zn-ui .seg button { padding: 6px 9px; }
  }

  @media (prefers-color-scheme: dark) {
    /* o app 3D tem fundo claro proprio; mantemos o loader coerente com ele */
    html, body { background: #fff; }
  }
</style>
</head>
<body>

<div class="zn--wrapper"></div>

<button id="zn-back" type="button">&#8592; Voltar </button>

<!-- Barra de configuracao (cores exterior/interior e vista).
     Ligada por padrao; ?bar=0 esconde. -->
<div id="zn-ui" role="toolbar" aria-label="Configuracao do Denza Z9GT">
  <div class="grp" id="zn-ui-ext"></div>
  <div class="sep"></div>
  <div class="grp" id="zn-ui-int"></div>
  <div class="sep"></div>
  <div class="seg" id="zn-ui-view"></div>
</div>

<div id="zn-loader">
  <div class="zl-label">Denza Z9GT</div>
  <div class="zl-track"><div class="zl-bar" id="zn-bar"></div></div>
  <div class="zl-pct" id="zn-pct">0%</div>
</div>

<div id="zn-error">
  <b>Nao foi possivel carregar o modelo 3D.</b>
  <span id="zn-error-msg">Verifique a conexao. O visualizador depende dos arquivos hospedados em www.denza.com.</span>
</div>

<script type="module">
/* ------------------------------------------------------------------
   Denza Z9GT — visualizador 3D isolado para embed via <iframe>.

   O canvas three.js da pagina original nao e HTML estatico: ele e
   criado por um modulo ES publico da propria Denza,
     /material/__CN/denza-overseas/public/vrsource/am-z9gt-config/model.js
   que exporta init({ path, lang, onProgress, onZoom, onBack }) e monta
   toda a UI (cores, rodas, interior, cenas) dentro de .zn--wrapper.
   Este arquivo apenas hospeda esse runtime em uma pagina limpa.
------------------------------------------------------------------ */

const BASE = 'https://www.denza.com/material/__CN/denza-overseas/public/vrsource/am-z9gt-config';

const q = new URLSearchParams(location.search);

// Idiomas realmente publicados neste build: pt, es, en
const LANGS = ['pt', 'es', 'en'];
const lang  = LANGS.includes(q.get('lang')) ? q.get('lang') : 'pt';

if (q.get('ui') === 'full') document.body.classList.add('ui-full');

const loaderEl = document.getElementById('zn-loader');
const barEl    = document.getElementById('zn-bar');
const pctEl    = document.getElementById('zn-pct');

const post = (msg) => {
  try { parent.postMessage(Object.assign({ source: 'denza-z9gt-3d' }, msg), '*'); } catch (e) {}
};

const fail = (err) => {
  console.error('[denza-z9gt-3d]', err);
  document.getElementById('zn-error-msg').textContent =
    'Verifique a conexao. Detalhe: ' + (err && err.message ? err.message : err);
  document.getElementById('zn-error').classList.add('show');
  loaderEl.classList.add('hidden');
  post({ event: 'error', message: String(err && err.message || err) });
};

// Valores aceitos pela API do modelo (extraidos do build oficial)
const VALUES = {
  exteriorColor: ['green', 'cyan', 'gold', 'blue', 'o-black'],
  interiorColor: ['red', 'black', 'white'],
  wheel:         ['wheel-0', 'wheel-1', 'wheel-2'],
  sideMirror:    ['ev', 'dm'],
  version:       ['ev'],
  lookSwitch:    ['outer', 'inner', 'inner-fr', 'inner-back', 'wheel', 'space', 'scene'],
};

/* ------------------------------------------------------------------
   Cores das bolinhas: cada codigo do modelo recebe um hex aqui.
   Um codigo que nao estiver neste mapa cai no proprio nome como cor CSS.
   Edite so este objeto para mudar a aparencia das bolinhas.            */
const HEX = {
  green:     '#1b454b',
  cyan:      '#818e87',
  gold:      '#8f9192',
  blue:      '#1f2754',
  'o-black': '#393939',
  // interior:
  red:   '#523b49',
  black: '#1b1b1e',
  white: '#b8c1c9',
};
const swatch = (code) => HEX[code] || code;

// Textos dos segmentos que nao sao cor (apenas vista; rodas removidas da barra)
const SEG = {
  view: { outer: 'Exterior', inner: 'Interior' },
};

let instance = null;

const apply = (action, value) => {
  if (!instance || typeof instance[action] !== 'function') return false;
  try { instance[action](value); return true; }
  catch (e) { console.warn('[denza-z9gt-3d]', action, e); return false; }
};

try {
  const { init } = await import(/* @vite-ignore */ `${BASE}/model.js`);

  instance = await init({
    path: {
      draco:   `${BASE}/draco`,
      model:   `${BASE}/model`,
      assets:  `${BASE}/assets`,
      locales: `${BASE}/locales`,
      product: `${BASE}/product`,
    },
    lang,
    onProgress: (p) => {
      const pct = Math.max(0, Math.min(100, Math.round((p || 0) * 100)));
      barEl.style.width = pct + '%';
      pctEl.textContent = pct + '%';
      post({ event: 'progress', value: pct });
      if (pct >= 100) {
        loaderEl.classList.add('hidden');
        setTimeout(() => { loaderEl.style.display = 'none'; }, 500);
      }
    },
    // No site original o "voltar" devolve para a galeria 2D e pausa o render.
    // Dentro do embed nao existe galeria: retomamos o render para nao travar.
    onBack: () => { apply('render', 'play'); post({ event: 'back' }); },
    onZoom: (state) => post({ event: 'zoom', value: state }),
  });

  if (!instance) throw new Error('init() retornou vazio');

  // ---- estado atual, refletido na barra ---------------------------
  const CONF = {
    exteriorColor: q.get('color'),
    interiorColor: q.get('interior'),
    wheel:         q.get('wheel'),
    view:          q.get('view'),
  };
  const showBar = q.get('bar') !== '0' && q.get('bar') !== 'false';
  const syncBar = [];

  // ---- configuracao inicial via query string ----------------------
  // ex.: ?lang=pt&color=blue&wheel=wheel-2&interior=white&view=outer
  const initial = [
    ['exteriorColor', q.get('color')],
    ['wheel',         q.get('wheel')],
    ['interiorColor', q.get('interior')],
    ['sideMirror',    q.get('mirror')],
    ['lookSwitch',    q.get('view')],
  ];
  for (const [action, value] of initial) {
    if (value && (!VALUES[action] || VALUES[action].includes(value))) apply(action, value);
  }

  // ---- barra de opcoes (cores/interior/vista) ---------------------
  const pressBtn = (el, on) => el.setAttribute('aria-pressed', on ? 'true' : 'false');
  const refreshBar = () => syncBar.forEach((fn) => fn());

  /* Ponto unico de mudanca: aplica no modelo, atualiza CONF e re-sincroniza.
     lookSwitch antes de cor/roda porque esses itens so aparecem por fora;
     interior implica olhar por dentro. E o mesmo comportamento do site oficial. */
  const setOption = (patch) => {
    if ('exteriorColor' in patch) {
      apply('lookSwitch', 'outer');
      apply('exteriorColor', patch.exteriorColor);
      CONF.exteriorColor = patch.exteriorColor; CONF.view = 'outer';
    }
    if ('wheel' in patch) {
      apply('lookSwitch', 'outer');
      apply('wheel', patch.wheel);
      CONF.wheel = patch.wheel; CONF.view = 'outer';
    }
    if ('interiorColor' in patch) {
      apply('lookSwitch', 'inner');
      apply('interiorColor', patch.interiorColor);
      CONF.interiorColor = patch.interiorColor; CONF.view = 'inner';
    }
    if ('view' in patch) {
      apply('lookSwitch', patch.view);
      CONF.view = patch.view;
    }
    refreshBar();
    post({ event: 'changed', config: patch });
  };

  const buildBar = () => {
    document.body.classList.add('has-bar');

    // bolinhas de cor: geradas direto dos codigos do modelo (VALUES).
    // guarda: se o grupo nao existir/estiver vazio, nao desenha (nao quebra).
    const dots = (host, key) => {
      if (!host || !VALUES[key]) return;
      for (const code of VALUES[key]) {
        const b = document.createElement('button');
        b.className = 'dot';
        b.style.background = swatch(code);
        b.title = (key === 'interiorColor' ? 'Interior: ' : '') + code;
        b.setAttribute('aria-label', b.title);
        b.onclick = () => setOption({ [key]: code });
        host.append(b);
        syncBar.push(() => pressBtn(b, CONF[key] === code));
      }
    };
    dots(document.getElementById('zn-ui-ext'), 'exteriorColor');
    dots(document.getElementById('zn-ui-int'), 'interiorColor');

    // segmentos de texto (vista). Mesma guarda.
    const seg = (host, key) => {
      if (!host || !SEG[key]) return;
      for (const [code, label] of Object.entries(SEG[key])) {
        const b = document.createElement('button');
        b.textContent = label;
        b.title = label + ' (' + code + ')';
        b.onclick = () => setOption({ [key]: code });
        host.append(b);
        syncBar.push(() => pressBtn(b, CONF[key] === code));
      }
    };
    seg(document.getElementById('zn-ui-view'), 'view');

    refreshBar();
  };

  // ---- controle pelo site hospedeiro (opcional) -------------------
  // parent.postMessage({ target:'denza-z9gt-3d', action:'exteriorColor', value:'gold' }, '*')
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d || d.target !== 'denza-z9gt-3d' || typeof d.action !== 'string') return;
    apply(d.action, d.value);
    // mantem a barra em sincronia quando a troca vem da pagina-mae
    if (d.action === 'exteriorColor') CONF.exteriorColor = d.value;
    else if (d.action === 'interiorColor') CONF.interiorColor = d.value;
    else if (d.action === 'wheel') CONF.wheel = d.value;
    else if (d.action === 'lookSwitch') CONF.view = d.value;
    refreshBar();
  });

  // Pausa o render quando o iframe sai da viewport do site hospedeiro,
  // para nao consumir GPU/bateria numa pagina longa.
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(([entry]) => {
      apply('render', entry.isIntersecting ? 'play' : 'pause');
    }, { threshold: 0.01 });
    io.observe(document.querySelector('.zn--wrapper'));
  }

  if (showBar) buildBar();
  document.body.classList.add('zn-ready');

  window.znDenza = instance;   // acesso manual no console, se precisar
  post({ event: 'ready', lang, values: VALUES });

} catch (err) {
  fail(err);
}
</script>

<!-- Botao "Voltar ao 360": aparece ao clicar em Espaco/Tecnologia e
     retorna a vista exterior (o giro 360 padrao). -->
<script>
(function () {
  var TRIGGERS = ['Espaço', 'Tecnologia'];
  var back = document.getElementById('zn-back');

  function showBack() { if (back) back.classList.add('show'); }
  function hideBack() { if (back) back.classList.remove('show'); }

  if (back) {
    back.addEventListener('click', function () {
      if (window.znDenza && typeof window.znDenza.lookSwitch === 'function') {
        window.znDenza.lookSwitch('outer');
      }
      hideBack();
    });
  }

  // Detecta clique nos botoes Espaco/Tecnologia (event delegation na fase de
  // captura, para resistir a re-render do app Vue da Denza).
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest &&
             e.target.closest('button,a,[class*="btn"],[class*="tab"]');
    if (!el) return;
    var t = (el.textContent || '').trim();
    if (TRIGGERS.indexOf(t) !== -1) showBack();
  }, true);
})();
</script>

</body>
</html>
